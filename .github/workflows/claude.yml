name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # DNPclaude GitHub App: Claude acts as DNPclaude[bot], never as a person.
      - name: Get DNPclaude app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DNPCLAUDE_APP_ID }}
          private-key: ${{ secrets.DNPCLAUDE_PRIVATE_KEY }}
          # The app holds wide org permissions; each run gets only these, on this repo only.
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          use_sticky_comment: true
          allowed_bots: "cursor"
          claude_args: '--allowedTools "Bash(npm install:*),Bash(npm ci:*),Bash(npm audit:*),Bash(npm run lint:*),Bash(npm run build:*)"'
          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # Public audit trail: one line per run on the "Agent log" issue.
      - name: Append to agent log
        if: always() && vars.AGENT_LOG_ISSUE != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LOG_ISSUE: ${{ vars.AGENT_LOG_ISSUE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_URL: ${{ github.event.comment.html_url || github.event.review.html_url || github.event.issue.html_url }}
          ACTOR: ${{ github.actor }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: >-
          gh issue comment "$LOG_ISSUE" --repo "$GITHUB_REPOSITORY"
          --body "$(date -u +%FT%TZ) · $GITHUB_EVENT_NAME by $ACTOR · outcome: $OUTCOME · trigger: $TRIGGER_URL · run: $RUN_URL"
