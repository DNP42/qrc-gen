name: Tests
on:
  pull_request:
jobs:
  tests:
    permissions:
      contents: read
    uses: DNP42/.github/.github/workflows/tests.yml@main
    with:
      gate: npm ci && npm run lint && npm run build
      node-version: '22'
      app-id: ${{ vars.DNPCLAUDE_APP_ID || '5756777' }}
      agent-log-issue: ${{ vars.AGENT_LOG_ISSUE || '' }}
    secrets: inherit
